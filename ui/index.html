<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiger.M.M · 星港</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080403;--bg-deep:#050302;--sidebar:#0b0604;
  --gold:#F5B301;--gold-deep:#c89010;--gold-dim:#8a6d20;
  --fg:#d9d4cc;--dim:#8a857e;--faint:#5a5550;
  --border:rgba(255,172,2,.10);--border-strong:rgba(255,172,2,.24);
}
html,body{height:100%;width:100%;overflow:hidden;font:14px/1.65 'Inter','Microsoft YaHei','PingFang SC','Helvetica Neue',sans-serif;background:var(--bg-deep);color:var(--fg);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:row;max-width:1200px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.6)}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(255,172,2,.16),rgba(255,172,2,.06));border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,172,2,.30)}

/* ══════════ Sidebar ══════════ */
#sidebar{width:272px;min-width:272px;background:linear-gradient(180deg,#0c0704 0%,#080403 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 20px;overflow:hidden;position:relative}
#sidebar::after{content:'';position:absolute;right:-1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(255,172,2,.16) 20%,rgba(255,172,2,.16) 80%,transparent);opacity:.5;pointer-events:none}

/* Logo 区 — 日食环 + 字标 */
#brand{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid rgba(255,172,2,.07);flex-shrink:0}
.brand-ring{width:40px;height:40px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,172,2,.14),rgba(255,172,2,.03) 58%,transparent 72%)}
.brand-ring::before{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,172,2,.5);box-shadow:0 0 16px rgba(255,172,2,.22),inset 0 0 10px rgba(255,172,2,.10)}
.brand-ring::after{content:'';position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(255,172,2,.16)}
.brand-ring span{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1px;text-shadow:0 0 10px rgba(255,172,2,.55)}
#brand-name{font-size:15px;color:var(--gold);font-weight:700;letter-spacing:4px;text-shadow:0 0 20px rgba(255,172,2,.28);line-height:1.2}
#brand-sub{font-size:10px;color:var(--faint);letter-spacing:2.5px;margin-top:3px}

.side-title{font-size:10px;color:var(--faint);letter-spacing:3px;margin:0 0 12px;font-weight:600;text-transform:uppercase}
.side-section{margin-bottom:18px;flex-shrink:0}

/* 模型切换 — 网格卡片 */
#model-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#model-switch button{background:rgba(255,172,2,.02);border:1px solid var(--border);color:#7a756d;padding:6px 6px 6px 11px;border-radius:9px;cursor:pointer;font-size:11px;letter-spacing:.4px;text-align:left;display:flex;align-items:center;gap:7px;transition:all .22s cubic-bezier(.4,0,.2,1)}
#model-switch button:hover{color:#b5b0a8;border-color:rgba(255,172,2,.22);background:rgba(255,172,2,.04)}
#model-switch button.active{color:var(--gold);border-color:rgba(255,172,2,.35);background:linear-gradient(180deg,rgba(255,172,2,.10),rgba(255,172,2,.04));box-shadow:0 0 14px rgba(255,172,2,.10),inset 0 1px 0 rgba(255,172,2,.08)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:all .22s ease}
#model-switch button.active .dot{box-shadow:0 0 8px rgba(74,170,136,.8)}

/* 状态 — 数字金色 */
.stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--dim);padding:2px 2px;line-height:1.5;border-bottom:1px solid rgba(255,172,2,.04)}
.stat-row:last-child{border-bottom:none}
.stat-row b{color:#cdbfa0;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}

/* 待审批 */
#inbox{font-size:12px;min-height:0}
.inbox-item{background:rgba(255,172,2,.025);border:1px solid var(--border);border-radius:11px;padding:12px 13px;margin-bottom:9px;transition:all .2s ease}
.inbox-item:hover{background:rgba(255,172,2,.05);border-color:rgba(255,172,2,.2)}
.inbox-title{color:var(--gold);font-size:12px;margin-bottom:6px;font-weight:600;letter-spacing:.3px}
.inbox-body{color:#8a857e;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:72px;overflow-y:auto;margin-bottom:10px;line-height:1.55}
.inbox-actions{display:flex;gap:6px}
.inbox-actions button{flex:1;background:rgba(255,172,2,.03);border:1px solid var(--border);color:var(--gold);padding:6px 0;border-radius:7px;cursor:pointer;font-size:11px;transition:all .18s ease}
.inbox-actions button:hover{background:rgba(255,172,2,.12)}
.inbox-actions button.deny{color:#b0806a;border-color:rgba(176,110,90,.14)}
.inbox-actions button.deny:hover{background:rgba(176,80,60,.08)}
.inbox-empty{color:var(--faint);font-size:11px;text-align:center;padding:18px 0}

/* 侧栏底部 — 版本 */
#side-foot{margin-top:auto;padding-top:12px;font-size:10px;color:var(--faint);letter-spacing:1.5px;border-top:1px solid rgba(255,172,2,.06);flex-shrink:0}

/* ══════════ Main area ══════════ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:
  radial-gradient(1000px 520px at 74% -12%,rgba(255,172,2,.075),transparent 60%),
  radial-gradient(760px 440px at 10% 108%,rgba(255,172,2,.045),transparent 58%),
  radial-gradient(560px 320px at 50% 50%,rgba(255,172,2,.015),transparent 70%),
  var(--bg);position:relative}

/* 漂浮星光 */
#main::before,#main::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0}
#main::before{background-image:
  radial-gradient(1.4px 1.4px at 12% 22%,rgba(255,172,2,.55),transparent 55%),
  radial-gradient(1px 1px at 34% 64%,rgba(255,172,2,.42),transparent 55%),
  radial-gradient(1.6px 1.6px at 58% 12%,rgba(255,172,2,.46),transparent 55%),
  radial-gradient(1px 1px at 76% 38%,rgba(255,172,2,.38),transparent 55%),
  radial-gradient(1.3px 1.3px at 90% 72%,rgba(255,172,2,.44),transparent 55%),
  radial-gradient(1px 1px at 44% 88%,rgba(255,172,2,.34),transparent 55%),
  radial-gradient(1.2px 1.2px at 22% 48%,rgba(255,172,2,.4),transparent 55%),
  radial-gradient(1px 1px at 66% 54%,rgba(255,172,2,.34),transparent 55%);
  animation:starTwinkle 7s ease-in-out infinite alternate}
#main::after{background-image:
  radial-gradient(1px 1px at 8% 82%,rgba(255,172,2,.46),transparent 55%),
  radial-gradient(1.3px 1.3px at 28% 8%,rgba(255,172,2,.38),transparent 55%),
  radial-gradient(1px 1px at 50% 36%,rgba(255,172,2,.4),transparent 55%),
  radial-gradient(1.4px 1.4px at 70% 86%,rgba(255,172,2,.44),transparent 55%),
  radial-gradient(1px 1px at 84% 16%,rgba(255,172,2,.36),transparent 55%),
  radial-gradient(1px 1px at 96% 52%,rgba(255,172,2,.42),transparent 55%);
  animation:starTwinkle 9s ease-in-out infinite alternate-reverse}
@keyframes starTwinkle{0%{opacity:.35}100%{opacity:.7}}

/* Top bar — 金线细描 */
#topbar{padding:13px 30px;font-size:11px;color:var(--dim);letter-spacing:1.8px;display:flex;align-items:center;gap:9px;flex-shrink:0;position:relative;z-index:1;background:linear-gradient(180deg,rgba(20,13,7,.92),rgba(10,7,4,.6));border-bottom:1px solid rgba(255,172,2,.09);backdrop-filter:blur(4px)}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent 4%,rgba(255,172,2,.30) 30%,rgba(255,172,2,.36) 62%,transparent 96%);opacity:.7}
#topbar b{color:var(--gold);font-weight:500;font-size:1.05em;text-shadow:0 0 12px rgba(255,172,2,.35)}

/* Chat container */
#chat-container{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
#chat{flex:1;overflow-y:auto;padding:26px 34px;scroll-behavior:smooth}

/* Empty state — 日食之环 */
#empty-state{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#555;position:relative;z-index:1}
#empty-state.visible{display:flex}
.empty-ring{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative;background:radial-gradient(circle,rgba(255,172,2,.12),rgba(255,172,2,.02) 60%,transparent 72%)}
.empty-ring::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(255,172,2,.42);box-shadow:0 0 26px rgba(255,172,2,.18),inset 0 0 20px rgba(255,172,2,.10);animation:ringPulse 4.5s ease-in-out infinite}
.empty-ring::after{content:'';position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,172,2,.16)}
@keyframes ringPulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.empty-ring-inner{color:var(--gold);font-size:1.5em;letter-spacing:3px;font-weight:700;text-shadow:0 0 20px rgba(255,172,2,.55)}
.empty-label{font-size:13px;color:#c4b59a;letter-spacing:6px;text-shadow:0 0 18px rgba(255,172,2,.14)}
.empty-divider{width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,172,2,.34),transparent);margin:6px 0;box-shadow:0 0 8px rgba(255,172,2,.2)}
.empty-sub{font-size:11px;color:#5f5a53;letter-spacing:2px}

/* Messages — 无框文本 + 金色锚点线 */
.msg-wrapper{margin:12px 0;animation:msgIn .32s cubic-bezier(.4,0,.2,1);position:relative;z-index:1}
@keyframes msgIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}

.msg{word-break:break-word;white-space:pre-wrap;line-height:1.75;font-size:14px}
.msg-text{margin-top:2px;color:#dcd7ce}
.msg img{max-width:100%;border-radius:8px;border:1px solid var(--border);margin:8px 0 4px;cursor:pointer;opacity:.92}
.msg img:hover{opacity:1;border-color:rgba(255,172,2,.28)}

/* Meta line */
.msg-meta{font-size:10px;color:#6f6a63;margin-bottom:4px;letter-spacing:.8px;display:flex;align-items:center;gap:9px}
.msg-time{opacity:.65;font-variant-numeric:tabular-nums}
.msg-meta span:first-child{color:#c79a4a;opacity:.95;font-weight:600}

/* User - RIGHT 淡金 + 右锚点线 */
.user{margin-left:auto;text-align:right;width:max-content;max-width:240px;padding-right:16px;border-right:2px solid rgba(255,172,2,.28)}
.user .msg-text{text-align:right;color:#f0dda8;overflow-wrap:break-word;word-break:break-word}

/* Assistant - LEFT 米白 + 左锚点线 */
.assistant{margin-right:auto;width:max-content;max-width:240px;padding-left:16px;border-left:2px solid rgba(255,172,2,.16)}
.assistant .msg-text{overflow-wrap:break-word;word-break:break-word}

/* Error bubble */
.error-msg .msg{background:rgba(180,60,50,.08)!important;border:1px solid rgba(180,60,50,.2)!important;border-radius:10px!important;padding:10px 14px!important}
.error-msg .msg-text{color:#cc6666}

/* Typing dots */
.typing-dots{display:flex;gap:6px;padding:5px 0}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.3}
.typing-dots span:nth-child(2){animation:bounceDot 1.4s ease-in-out .15s infinite}
.typing-dots span:nth-child(3){animation:bounceDot 1.4s ease-in-out .3s infinite}
@keyframes bounceDot{0%,55%,100%{opacity:.3;transform:translateY(0)}28%{opacity:.85;transform:translateY(-5px)}}

/* Trace panel — 细框 */
details.trace{margin-top:12px;border:1px solid rgba(255,172,2,.14);border-radius:9px;background:rgba(255,172,2,.02);overflow:hidden;font-size:12px;max-width:100%}
details.trace summary{cursor:pointer;padding:9px 15px;color:#8a857d;list-style:none;user-select:none;font-size:12px;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
details.trace summary::-webkit-details-marker{display:none}
details.trace summary::before{content:'▸';display:inline-block;transition:transform .2s ease;font-size:11px;color:#666}
details.trace[open] summary::before{transform:rotate(90deg)}
details.trace summary:hover{color:#999}
details.trace[open] summary{color:var(--gold);border-bottom:1px solid var(--border);padding-bottom:10px}
.trace-list{padding:2px 0}
.trace-item{padding:11px 15px;border-bottom:1px solid rgba(255,172,2,.03)}
.trace-item:last-child{border-bottom:none}
.trace-item:hover{background:rgba(255,172,2,.02)}
.trace-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.trace-head b{color:var(--gold);font-size:12px}
.trace-tool-name{color:#999;font-size:12px}
.trace-status{font-size:11px;font-weight:600}
.trace-status.ok{color:#4aa877}
.trace-status.fail{color:#aa6666}
.trace-args{color:#999;font-size:11.5px;white-space:pre-wrap;word-break:break-all;line-height:1.6;padding:7px 11px;background:rgba(0,0,0,.22);border-radius:6px;margin-top:5px;max-height:90px;overflow-y:auto}
.trace-result{color:#999;font-size:11.5px;white-space:pre-wrap;word-break:break-all;line-height:1.6;padding:7px 11px;margin-top:5px;border-left:2px solid rgba(255,172,2,.12);max-height:120px;overflow-y:auto}

/* INPUT AREA — 鎏金底托 */
#input-area{padding:16px 30px 12px;border-top:1px solid rgba(255,172,2,.09);flex-shrink:0;position:relative;z-index:1;background:linear-gradient(180deg,rgba(22,16,8,.75),#120d07)}
#input-area::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 6%,rgba(255,172,2,.24) 38%,rgba(255,172,2,.28) 62%,transparent 94%)}
.input-row{display:flex;gap:11px;align-items:flex-end}
#input{flex:1;background:linear-gradient(180deg,#2c2417,#241d12);color:#e7e1d5;border:1px solid rgba(255,172,2,.24);padding:13px 17px;border-radius:13px;font-size:14px;outline:none;resize:none;font-family:inherit;line-height:1.55;transition:border-color .2s ease,box-shadow .2s ease;box-shadow:inset 0 1px 4px rgba(0,0,0,.38)}
#input:focus{border-color:rgba(255,172,2,.48);box-shadow:inset 0 1px 4px rgba(0,0,0,.38),0 0 0 3px rgba(255,172,2,.08),0 0 24px rgba(255,172,2,.09)}
#input::placeholder{color:#6a635a}
#send{background:linear-gradient(135deg,#e0a010,#b87f08);color:#1a1002;border:none;padding:0 26px;border-radius:13px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:2px;flex-shrink:0;min-width:70px;height:46px;box-shadow:0 2px 16px rgba(255,172,2,.22),inset 0 1px 0 rgba(255,255,255,.22);transition:all .2s cubic-bezier(.4,0,.2,1)}
#send:hover:not(:disabled){background:linear-gradient(135deg,#f0b014,#d09010);box-shadow:0 4px 22px rgba(255,172,2,.36),inset 0 1px 0 rgba(255,255,255,.26);transform:translateY(-1px)}
#send:active:not(:disabled){transform:scale(.97)}
#send:disabled{opacity:.32;cursor:not-allowed;box-shadow:none}
.send-hint{font-size:10px;color:#5a554e;text-align:center;margin-top:7px;letter-spacing:1.4px}

/* Lightbox */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox.visible{display:flex}
#lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 0 40px rgba(255,172,2,.14)}

/* ══════════ Right Panel — 驾驶舱数据 ══════════ */
#panel{width:280px;min-width:280px;background:linear-gradient(180deg,#0c0704 0%,#080403 100%);border-left:1px solid var(--border);display:flex;flex-direction:column;padding:24px 20px;overflow:hidden;position:relative}
#panel::before{content:'';position:absolute;left:-1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(255,172,2,.16) 20%,rgba(255,172,2,.16) 80%,transparent);opacity:.5;pointer-events:none}
.panel-section{margin-bottom:20px;flex-shrink:0}
.panel-section.grow{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
.panel-title{font-size:10px;color:var(--faint);letter-spacing:3px;margin:0 0 12px;font-weight:600;text-transform:uppercase}
.panel-stat-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--dim);padding:2px 2px;line-height:1.5;border-bottom:1px solid rgba(255,172,2,.04)}
.panel-stat-row:last-child{border-bottom:none}
.panel-stat-row b{color:#cdbfa0;font-variant-numeric:tabular-nums;font-weight:600;font-size:12px}
#panel-history{min-height:0}
.panel-hist-item{display:flex;gap:8px;align-items:baseline;padding:5px 2px;border-bottom:1px solid rgba(255,172,2,.04);font-size:11px}
.panel-hist-item:last-child{border-bottom:none}
.p-role{flex-shrink:0;font-size:10px;font-weight:600}
.p-role.u{color:#c79a4a}
.p-role.a{color:#8a857e}
.p-text{color:#8a857e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel-trace{flex:1;min-height:0;overflow-y:auto}
.panel-trace-item{display:flex;gap:7px;align-items:center;padding:6px 8px;margin-bottom:5px;border:1px solid var(--border);border-radius:7px;background:rgba(255,172,2,.02);font-size:11px}
.p-round{color:var(--gold);font-weight:600;flex-shrink:0}
.p-tool{color:#b5b0a8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-status{font-size:10px;font-weight:600;flex-shrink:0}
.p-status.ok{color:#4aa877}
.p-status.fail{color:#aa6666}
.panel-empty{color:var(--faint);font-size:11px;text-align:center;padding:16px 0}
</style>
</head>
<body>
<div id="sidebar">
  <div id="brand">
    <div class="brand-ring"><span>TM</span></div>
    <div>
      <div id="brand-name">TIGER.M.M</div>
      <div id="brand-sub">虎哥·凌霄 · 星港驾驶舱</div>
    </div>
  </div>
  <div class="side-section">
    <div class="side-title">模型</div>
    <div id="model-switch">
      <button data-model="auto"><span class="dot"></span>auto</button>
      <button data-model="deepseek"><span class="dot"></span>deepseek</button>
      <button data-model="mimo"><span class="dot"></span>mimo</button>
      <button data-model="qwen"><span class="dot"></span>qwen</button>
      <button data-model="ollama"><span class="dot"></span>ollama</button>
    </div>
  </div>
  <div class="side-section" style="flex:1;overflow-y:auto;min-height:0;margin-bottom:0">
    <div class="side-title">待审批 <span id="inbox-count" style="color:var(--gold);margin-left:3px;font-size:11px">(0)</span></div>
    <div id="inbox"><div class="inbox-empty">无待审批</div></div>
  </div>
  <div id="side-foot">TIGER.M.M · v4.2</div>
</div>
<div id="main">
  <div id="topbar"><span class="dot" style="background:#4aa877"></span><span id="topbar-text">连接中...</span></div>
  <div id="chat-container">
    <div id="empty-state">
      <div class="empty-ring"><div class="empty-ring-inner">TM</div></div>
      <div class="empty-label">星港驾驶舱就绪</div>
      <div class="empty-divider"></div>
      <div class="empty-sub">输入指令开始对话</div>
    </div>
    <div id="chat"></div>
  </div>
  <div id="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="直接说..." autofocus></textarea>
      <button id="send">发 送</button>
    </div>
    <div class="send-hint">Enter 发送 · Shift+Enter 换行</div>
  </div>
</div>
<div id="lightbox"><img id="lightbox-img" src=""></div>
<div id="panel">
  <div class="panel-section">
    <div class="panel-title">引擎状态</div>
    <div id="panel-stats"><div class="panel-stat-row"><span>加载中...</span></div></div>
  </div>
  <div class="panel-section">
    <div class="panel-title">最近会话</div>
    <div id="panel-history"><div class="panel-empty">暂无历史</div></div>
  </div>
  <div class="panel-section grow">
    <div class="panel-title">工具轨迹</div>
    <div id="panel-trace"><div class="panel-empty">尚未执行工具</div></div>
  </div>
</div>
<script>
(function(){
'use strict';
var chatEl=document.getElementById('chat'),emptyState=document.getElementById('empty-state');
var inputEl=document.getElementById('input'),sendBtn=document.getElementById('send');
var topbarText=document.getElementById('topbar-text');
var lightbox=document.getElementById('lightbox'),lightboxImg=document.getElementById('lightbox-img');
var currentModel='auto',sending=false,msgCount=0;

function toggleEmpty(){emptyState.classList.toggle('visible',msgCount===0)}
function getTime(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

function updateModelSwitch(){
  var btns=document.querySelectorAll('#model-switch button');
  for(var i=0;i<btns.length;i++){
    var a=btns[i].dataset.model===currentModel;
    btns[i].classList.toggle('active',a);
    var dot=btns[i].querySelector('.dot');
    if(dot)dot.style.background=a?'#4aa877':'#3a352c';
  }
}
var allBtns=document.querySelectorAll('#model-switch button');
for(var i=0;i<allBtns.length;i++)(function(b){b.addEventListener('click',function(){currentModel=b.dataset.model;updateModelSwitch()})})(allBtns[i]);

function esc(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c})}
function renderRich(text){
  var s=esc(text||'');
  return s.replace(/([A-Za-z]:[\\/][^\s"<']+?\.(png|jpg|jpeg|gif|bmp|webp))/gi,function(m){
    return'<img src="/image?path='+encodeURIComponent(m)+'" onclick="window._lb(this.src)">';
  });
}
window._lb=function(url){lightboxImg.src=url;lightbox.classList.add('visible')};
lightbox.addEventListener('click',function(){lightbox.classList.remove('visible')});

function addMsg(role,text,modelLabel){
  msgCount++;toggleEmpty();
  var wrapper=document.createElement('div');wrapper.className='msg-wrapper '+role;
  var bubble=document.createElement('div');bubble.className='msg';

  var meta=document.createElement('div');meta.className='msg-meta';
  var mHTML='';if(modelLabel&&modelLabel!=='')mHTML+='<span>'+esc(modelLabel)+'</span>';
  mHTML+='<span class="msg-time">'+getTime()+'</span>';meta.innerHTML=mHTML;
  bubble.appendChild(meta);

  if(text){var cDiv=document.createElement('div');cDiv.className='msg-text';cDiv.innerHTML=renderRich(text);bubble.appendChild(cDiv)}

  wrapper.appendChild(bubble);chatEl.appendChild(wrapper);chatEl.scrollTop=chatEl.scrollHeight;
  return wrapper;
}

function createTypingBubble(){
  msgCount++;toggleEmpty();
  var wrapper=document.createElement('div');wrapper.className='msg-wrapper assistant';
  var bubble=document.createElement('div');bubble.className='msg';
  var meta=document.createElement('div');meta.className='msg-meta';
  meta.innerHTML='<span>虎哥</span><span class="msg-time">'+getTime()+'</span>';bubble.appendChild(meta);
  var dots=document.createElement('div');dots.className='typing-dots';
  dots.innerHTML='<span></span><span></span><span></span>';bubble.appendChild(dots);
  wrapper.appendChild(bubble);chatEl.appendChild(wrapper);chatEl.scrollTop=chatEl.scrollHeight;
  return wrapper;
}

function renderTrace(trace,targetWrapper){
  var box=document.createElement('details');box.className='trace';
  var summary=document.createElement('summary');
  summary.textContent='工具轨迹 ('+trace.length+')';box.appendChild(summary);
  var list=document.createElement('div');list.className='trace-list';

  for(var i=0;i<trace.length;i++){
    var t=trace[i],ok=!!t.success,item=document.createElement('div');item.className='trace-item';
    item.innerHTML=
      '<div class="trace-head"><b>#'+t.round+'</b> <span class="trace-tool-name">'+esc(t.tool)+'</span> <span class="trace-status '+(ok?'ok':'fail')+'">'+(ok?'成功':'失败')+'</span></div>'+
      '<div class="trace-args">'+esc(t.args||'')+'</div>'+
      (t.result?'<div class="trace-result">'+esc(t.result)+'</div>':'');
    list.appendChild(item);
  }
  box.appendChild(list);targetWrapper.appendChild(box);chatEl.scrollTop=chatEl.scrollHeight;
}

function renderTracePanel(trace){
  var box=document.getElementById('panel-trace');
  if(!box)return;
  if(!trace||!trace.length){box.innerHTML='<div class="panel-empty">尚未执行工具</div>';return}
  var html='';
  for(var i=0;i<trace.length;i++){
    var t=trace[i],ok=!!t.success;
    html+='<div class="panel-trace-item"><span class="p-round">#'+t.round+'</span><span class="p-tool">'+esc(t.tool)+'</span><span class="p-status '+(ok?'ok':'fail')+'">'+(ok?'✓':'✗')+'</span></div>';
  }
  box.innerHTML=html;
}

var liveTrace=[];
function renderTracePanelLive(){
  var box=document.getElementById('panel-trace');
  if(!box)return;
  if(!liveTrace.length){box.innerHTML='<div class="panel-empty">尚未执行工具</div>';return}
  var html='';
  for(var i=0;i<liveTrace.length;i++){
    var t=liveTrace[i];
    var st=t.status==='running'?'<span class="p-status" style="color:var(--gold)">…</span>':(t.success?'<span class="p-status ok">✓</span>':'<span class="p-status fail">✗</span>');
    html+='<div class="panel-trace-item"><span class="p-round">#'+(i+1)+'</span><span class="p-tool">'+esc(t.tool)+'</span>'+st+'</div>';
  }
  box.innerHTML=html;
}

async function doSend(){
  var msg=inputEl.value.trim();if(!msg||sending)return;
  if(msg==='/clear'){chatEl.innerHTML='';msgCount=0;toggleEmpty();return}

  addMsg('user',msg,'');inputEl.value='';liveTrace=[];
  var tb=createTypingBubble();sending=true;sendBtn.disabled=true;

  try{
    var r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,model:currentModel})});
    if(!r.ok){
      var eb=tb.querySelector('.msg');eb.className='msg error-msg';
      eb.innerHTML='<div class="msg-meta"><span class="msg-time">'+getTime()+'</span></div><div>Error: HTTP '+r.status+'</div>';
      var td=tb.querySelector('.typing-dots');if(td)td.remove();
      sending=false;sendBtn.disabled=false;return;
    }
    var reader=r.body.getReader(),decoder=new TextDecoder(),fullText='',lastModel='?';
    while(true){
      var result=await reader.read();if(result.done)break;
      var textChunk=decoder.decode(result.value,{stream:true}),NL=String.fromCharCode(10),lines=textChunk.split(NL);
      for(var li=0;li<lines.length;li++){
        var line=lines[li];
        if(line.startsWith('data:')){
          try{
            var d=JSON.parse(line.slice(5));
            if(d.type==='tool_start'){
              liveTrace.push({tool:d.tool,args:d.args,status:'running',success:false});
              renderTracePanelLive();
            }
            if(d.type==='tool_end'){
              if(liveTrace.length){var lt=liveTrace[liveTrace.length-1];lt.status='done';lt.success=!!d.success;lt.result=d.result;}
              renderTracePanelLive();
            }
            if(d.text){
              fullText+=d.text;
              var txtDiv=tb.querySelector('.msg-text');
              if(txtDiv){txtDiv.innerHTML=renderRich(fullText)}
              else{
                var nd=document.createElement('div');nd.className='msg-text';nd.innerHTML=renderRich(fullText);
                var ms=tb.querySelectorAll('.msg-meta');if(ms.length>0)ms[0].insertAdjacentElement('afterend',nd);
              }
              chatEl.scrollTop=chatEl.scrollHeight;
            }
            if(d.model)lastModel=d.model;
            if(d.done){
              var td2=tb.querySelector('.typing-dots');if(td2)td2.remove();
              var md=tb.querySelector('.msg-meta');
              if(md)md.innerHTML='<span>'+esc(lastModel==='?'?currentModel:lastModel)+'</span><span class="msg-time">'+getTime()+' · '+d.elapsed+'s</span>';
              if(d.trace&&d.trace.length>0){renderTrace(d.trace,tb);renderTracePanel(d.trace)}
              else if(liveTrace.length){renderTracePanelLive();}
              sending=false;sendBtn.disabled=false;return;
            }
            if(d.error){
              var eB=tb.querySelector('.msg');eB.className='msg error-msg';
              eB.innerHTML='<div class="msg-meta"><span class="msg-time">'+getTime()+'</span></div><div>Error: '+d.error+'</div>';
              var td3=tb.querySelector('.typing-dots');if(td3)td3.remove();
              sending=false;sendBtn.disabled=false;return;
            }
          }catch(e){}
        }
      }
    }
  }catch(e){
    var fB=tb.querySelector('.msg');if(fB){
      fB.className='msg error-msg';
      fB.innerHTML='<div class="msg-meta"><span class="msg-time">'+getTime()+'</span></div><div>Error: '+e.message+'</div>';
      var td4=tb.querySelector('.typing-dots');if(td4)td4.remove();
    }
    sending=false;sendBtn.disabled=false;
  }
}
sendBtn.addEventListener('click',doSend);
inputEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});

(async function loadHistory(){
  try{var r=await fetch('/history'),d=await r.json(),list=d.history||[];
  for(var i=0;i<list.length;i++)if(list[i].role&&list[i].text)addMsg(list[i].role,list[i].text,'');
  if(list.length>0){topbarText.textContent='已恢复 '+list.length+' 条历史'}
  var ph=document.getElementById('panel-history');
  if(ph&&list.length){
    var hh='';
    for(var j=Math.max(0,list.length-10);j<list.length;j++){
      var t=list[j];
      if(t.role&&t.text)hh+='<div class="panel-hist-item"><span class="p-role '+(t.role==='user'?'u':'a')+'">'+(t.role==='user'?'我':'虎哥')+'</span><span class="p-text">'+esc(t.text).slice(0,40)+'</span></div>';
    }
    ph.innerHTML=hh;
  }
  }catch(e){toggleEmpty()}
})();

async function pollInbox(){
  try{var r=await fetch('/inbox'),d=await r.json();
  var box=document.getElementById('inbox'),countEl=document.getElementById('inbox-count'),pending=(d.items||[]).length;
  countEl.textContent='('+pending+')';
  if(!pending){box.innerHTML='<div class="inbox-empty">无待审批</div>';return}
  box.innerHTML='';var NL=String.fromCharCode(10);
  for(var i=0;i<d.items.length;i++){
    var it=d.items[i],div=document.createElement('div');div.className='inbox-item';
    var titleD=document.createElement('div');titleD.className='inbox-title';titleD.textContent=it.title||'';
    var bodyD=document.createElement('div');bodyD.className='inbox-body';bodyD.textContent=((it.cmds||[]).join(NL)||it.body||'');
    var actD=document.createElement('div');actD.className='inbox-actions';
    var okBtn=document.createElement('button');okBtn.textContent='允许';
    okBtn.onclick=(function(id){return function(){resolveInbox(id,'allow')}})(it.id);
    var dnBtn=document.createElement('button');dnBtn.className='deny';dnBtn.textContent='拒绝';
    dnBtn.onclick=(function(id){return function(){resolveInbox(id,'deny')}})(it.id);
    actD.appendChild(okBtn);actD.appendChild(dnBtn);
    div.appendChild(titleD);div.appendChild(bodyD);div.appendChild(actD);box.appendChild(div);
  }
  }catch(e){}
}
window.resolveInbox=function(id,res){
  fetch('/inbox/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_id:id,resolution:res})})
  .then(function(r){return r.json()})
  .then(function(d){
    if(d.executed&&d.executed.length){
      var NL=String.fromCharCode(10);
      var lines=d.executed.map(function(e){return (e.ok?'✓':'✗')+' '+e.cmd+NL+(e.output?('  '+e.output):'');}).join(NL);
      addMsg('assistant','[Inbox 执行]'+NL+lines,'');
    }
    pollInbox();
  }).catch(function(){pollInbox()});
};

function fmtUptime(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>0?(h+'h'+m+'m'):((m+'m'+(s%60)+'s'))}
async function pollStats(){
  try{var r=await fetch('/stats'),d=await r.json();
  var pst=document.getElementById('panel-stats');
  if(d.error){if(pst)pst.textContent=d.error;return}
  if(pst)pst.innerHTML=
    '<div class="panel-stat-row"><span>运行</span><b>'+fmtUptime(d.uptime)+'</b></div>'+
    '<div class="panel-stat-row"><span>请求</span><b>'+d.total+'</b></div>'+
    '<div class="panel-stat-row"><span>错误</span><b style="color:'+(d.errors>0?'#a66':'')+'">'+d.errors+'</b></div>'+
    '<div class="panel-stat-row"><span>会话</span><b>'+d.sessions+'</b></div>'+
    '<div class="panel-stat-row"><span>Pending</span><b style="color:'+(d.pending>0?'#e86':'')+'">'+(d.pending||0)+'</b></div>';
  }catch(e){}
}
setInterval(pollInbox,4000);setInterval(pollStats,5000);
})();
</script>
