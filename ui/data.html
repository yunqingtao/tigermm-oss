<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiger.M.M · 数据面</title>
<style>
  :root{ --bg:#0a0502; --line:#3a2a12; --gold:#FFAC02; --txt:#e7dcc6; --dim:#8d7b5c; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:16px/1.62 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{padding:22px 26px 14px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.5px}
  h1 b{color:var(--gold)}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  main{padding:18px 26px 40px;max-width:1180px}
  section{margin:0 0 26px}
  h2{font-size:14px;color:var(--gold);font-weight:600;letter-spacing:2px;
     margin:0 0 10px;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid #1e1608;vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:12px;letter-spacing:1px}
  td.path{color:var(--dim);font-family:Consolas,monospace;font-size:12.5px;word-break:break-all}
  .card{border:1px solid var(--line);border-radius:2px;padding:12px 14px;margin:0 0 10px}
  .card .n{color:var(--gold);font-weight:600}
  .card .d{color:var(--dim);font-size:13.5px;margin-top:4px}
  ul{margin:0;padding-left:18px}li{margin:4px 0;font-size:14px}
  .empty{color:var(--dim);font-size:14px;padding:8px 0}
  .err{color:#c8642a;font-size:13.5px}
  footer{color:var(--dim);font-size:12px;padding:0 26px 26px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
       background:var(--gold);margin-right:7px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1><b>Tiger.M.M</b> · 数据面</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="state">连接中…</span>
    &nbsp;·&nbsp; 只读视图（产物 / 专家 / 审计），不改任何状态</div>
</header>
<main>
  <section>
    <h2>产物 · Artifacts</h2>
    <div id="artifacts" class="empty">载入中…</div>
  </section>
  <section>
    <h2>专家 · Experts</h2>
    <div id="experts" class="empty">载入中…</div>
  </section>
  <section>
    <h2>审计 · Audit</h2>
    <div id="audit" class="empty">载入中…</div>
  </section>
</main>
<footer id="foot">—</footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtSize(n){
  n = Number(n||0);
  if (!n) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

async function j(u){ const r = await fetch(u, {cache:"no-store"}); return await r.json(); }

function renderArtifacts(d){
  const items = (d && (d.items || d.artifacts)) || [];
  if (!items.length) return '<div class="empty">还没有登记过产物</div>';
  let h = '<table><tr><th>时间</th><th>类型</th><th>标题</th><th>路径</th><th>大小</th></tr>';
  for (const it of items){
    const t = it.ts || it.time || it.created || "";
    const when = typeof t === "number" ? new Date(t*1000).toLocaleString() : esc(t);
    h += "<tr><td>"+when+"</td><td>"+esc(it.kind)+"</td><td>"+esc(it.title||it.name)+"</td>"
       + '<td class="path">'+esc(it.path)+"</td><td>"+fmtSize(it.size)+"</td></tr>";
  }
  return h + "</table>";
}

function renderExperts(d){
  const items = (d && (d.experts || d.items)) || [];
  if (!items.length) return '<div class="empty">还没有专家定义</div>';
  let h = "";
  for (const e of items){
    h += '<div class="card"><div class="n">@'+esc(e.name)+"</div>"
       + '<div class="d">'+esc(e.description || e.desc || "")+"</div></div>";
  }
  return h;
}

function renderAudit(d){
  const items = (d && d.entries) || [];
  if (!items.length) return '<div class="empty">暂无审计记录</div>';
  let h = "<ul>";
  for (const e of items) h += "<li>" + esc(typeof e === "string" ? e : JSON.stringify(e)) + "</li>";
  return h + "</ul>";
}

async function tick(){
  try{
    const [a, e, u] = await Promise.all([j("/artifacts?limit=30"), j("/experts"), j("/audit?n=20")]);
    $("artifacts").outerHTML = '<div id="artifacts">' + renderArtifacts(a) + "</div>";
    $("experts").outerHTML   = '<div id="experts">'   + renderExperts(e)   + "</div>";
    $("audit").outerHTML     = '<div id="audit">'     + renderAudit(u)     + "</div>";
    $("state").textContent = "已连接 · " + new Date().toLocaleTimeString();
    $("foot").textContent = "数据来自本机引擎 (127.0.0.1:8800) · 每 10 秒刷新";
  }catch(err){
    $("state").textContent = "引擎未就绪（先启动 虎哥）";
    $("artifacts").innerHTML = '<div class="err">读不到 /artifacts —— 引擎没在跑？</div>';
    $("experts").innerHTML   = '<div class="err">读不到 /experts</div>';
    $("audit").innerHTML     = '<div class="err">读不到 /audit</div>';
  }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
