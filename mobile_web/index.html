<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>T Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#0D0D0D;color:#EBE1CD;height:100vh;display:flex;flex-direction:column}
.header{background:#141414;padding:12px 16px;border-bottom:1px solid rgba(255,172,2,0.1);display:flex;align-items:center;gap:8px}
.header .dot{width:8px;height:8px;background:#64C882;border-radius:50%}
.header .title{color:#FFAC02;font-weight:700;font-size:16px}
.messages{flex:1;overflow-y:auto;padding:12px}
.msg{margin:8px 0;max-width:85%}
.msg.me{margin-left:auto;text-align:right}
.msg .bubble{display:inline-block;padding:8px 12px;border-radius:10px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.me .bubble{background:rgba(255,172,2,0.12)}
.msg.you .bubble{background:#1a1a1a}
.msg img{max-width:100%;border-radius:8px;margin-top:4px}
.msg .time{font-size:10px;color:#888;margin-top:2px}
.system{text-align:center;color:#888;font-size:12px;margin:16px 0}
.input-area{display:flex;padding:12px;gap:8px;background:#141414;border-top:1px solid rgba(255,172,2,0.1)}
.input-area input{flex:1;background:#0D0D0D;border:1px solid rgba(255,172,2,0.15);border-radius:8px;color:#EBE1CD;padding:10px;font-size:14px;outline:none}
.input-area button{background:#FFAC02;color:#0D0D0D;border:none;padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="header">
  <div class="dot" id="dot"></div>
  <div class="title">虎哥</div>
  <span style="font-size:12px;color:#888;margin-left:auto" id="status">本地直连</span>
</div>
<div class="messages" id="msgs"></div>
<div class="input-area">
  <input id="inp" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">发送</button>
</div>
<script>
// HTTP API config - Auto-detect local IP
var API="http://10.39.127.156:8801";
var TOKEN="tmm-62a876219c3a833ffba38073";
var busy=false;

// Try common LAN IPs
(function detect(){
  var ips=["10.39.127.156","192.168.1.100","192.168.0.100","localhost"];
  var i=0;
  function tryNext(){
    if(i>=ips.length){status.textContent="离线";dot.style.background="#ff6b6b";return}
    API="http://"+ips[i]+":8801";
    fetch(API+"/",{signal:AbortSignal.timeout(3000)})
      .then(function(r){return r.json()})
      .then(function(d){
        status.textContent=d.name+" v"+d.version;
        dot.style.background="#64C882";
        add("已连接 "+d.name+" "+d.version,"system");
      })
      .catch(function(){i++;tryNext()});
  }
  tryNext();
})();

function add(txt,cls,img){
  var d=document.createElement("div");d.className="msg "+cls;
  var b=document.createElement("div");b.className="bubble";
  if(img){var i=document.createElement("img");i.src="data:image/jpg;base64,"+img;b.appendChild(i)}
  b.appendChild(document.createTextNode(txt));
  d.appendChild(b);msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}

async function send(){
  var t=inp.value.trim();if(!t||busy)return;
  add(t,"me");inp.value="";busy=true;
  status.textContent="处理中...";dot.style.background="#FFAC02";
  try{
    var resp=await fetch(API+"/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
      body:JSON.stringify({message:t})
    });
    var data=await resp.json();
    var reply=data.response||data.reply||"嗯？";
    // Check for image in reply
    if(data.image){
      add(reply,"you",data.image);
    }else{
      add(reply,"you");
    }
    status.textContent="就绪";dot.style.background="#64C882";
  }catch(e){
    add("连接失败: "+e.message,"system");
    status.textContent="离线";dot.style.background="#ff6b6b";
  }
  busy=false;
}
</script>
</body>
</html>
