[pytest]
norecursedirs = code_pool
; testpaths 必需: 否则裸跑 pytest 会从项目根收集, 撞上根目录的开发脚本
; (test_encoding.py 在模块级 sys.exit() → INTERNALERROR; test_ollama_*.py 会真调模型)
; 钉死测试目录后, `python -m pytest` = canonical 基线: **917 passed / 1 skipped / 0 failed**
;   (2026-09-20 校正; 旧注释写的 "3 failed / 262 passed" 是 09-18 契约修复前的旧基线, 已作废)
; 注意: 必须用项目解释器 Python311 跑 —— 终端默认的 venv 会报一堆 async 假红。
testpaths = tests
